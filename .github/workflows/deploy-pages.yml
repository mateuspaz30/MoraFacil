name: Deploy MoraFacil

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
        run: npm run build

      - name: SPA fallback for deep links
        run: cp dist/index.html dist/404.html

      - name: Add account route entry points
        run: |
          for route in \
            "" \
            "dashboard" \
            "meus-imoveis" \
            "imoveis" \
            "favoritos" \
            "minha-conta" \
            "conta" \
            "administração" \
            "admin" \
            "estatisticas" \
            "perfil-publico" \
            "visualizacao-imobiliaria/dashboard" \
            "visualizacao-imobiliaria/estatisticas" \
            "visualizacao-imobiliaria/perfil-publico"; do
            mkdir -p "dist/minha-area/$route"
            cp dist/index.html "dist/minha-area/$route/index.html"
          done

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
